name: "${COMPOSE_NAME}"
services:
  calendar:
    image: ghcr.io/kozea/radicale:stable
    container_name: calendar
    restart: unless-stopped
    ports:
      - 5232:5232
    volumes:
      - config:/etc/radicale
      - data:/var/lib/radicale/collections
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.calendar.entrypoints=websecure"
      - "traefik.http.routers.calendar.rule=Host(`${CALENDAR_SERVER_DOMAIN}`)"
      - "traefik.http.routers.calendar.service=calendar"
      - "traefik.http.services.calendar.loadbalancer.server.port=5232"
volumes:
  config:
    name: radicale-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./config
  data:
    name: radicale-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/collections
networks:
  proxy:
    name: "${TRAEFIK_NET_NAME}"
    driver: bridge
